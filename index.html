<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menú Interactivo</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <!-- Swiper CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen text-slate-800 antialiased">

  <!-- Preloader Overlay (Sin clases de color bg- de Tailwind) -->
  <div id="preloader" class="fixed inset-0 flex items-center justify-center pointer-events-auto">
    <img 
      id="logo-preload" 
      src="logo_bolisv2.png" 
      alt="Logo Preloader" 
      class="w-48 h-auto object-contain"
    />
  </div>

  <!-- Header / Navbar Principal -->
  <header class="p-4 flex justify-between items-center max-w-4xl mx-auto">
    <div class="flex items-center gap-3">
      <img 
        id="logo-target" 
        src="logo_bolisv2.png" 
        alt="Logo Principal" 
        class="w-16 h-auto object-contain opacity-0 transition-opacity"
      />
      <h1 class="heading-font text-2xl font-bold text-[#f477b1]">Menú</h1>
    </div>
  </header>

  <!-- Navegación por Categorías (Sticky) -->
  <nav class="category-nav max-w-4xl mx-auto">
    <button class="nav-pill is-active" data-target="seccion-bolis">Bolis</button>
    <button class="nav-pill" data-target="seccion-frappes">Frappés</button>
    <button class="nav-pill" data-target="seccion-congelados">Congelados</button>
  </nav>

  <!-- Contenido Principal / Secciones -->
  <main class="max-w-4xl mx-auto p-4 space-y-12">
    <!-- Sección Bolis -->
    <section id="seccion-bolis" class="menu-section space-y-4">
      <h2 class="heading-font text-xl font-bold">Bolis Gourmet</h2>
      <div class="grid grid-cols-2 gap-4">
        <button class="flavor-btn p-4 bg-white rounded-2xl shadow-sm text-left font-bold" data-flavor-name="Boli de Nutella" data-flavor-img="logo_bolisv2.png">
          Nutella
        </button>
        <button class="flavor-btn p-4 bg-white rounded-2xl shadow-sm text-left font-bold" data-flavor-name="Boli de Oreo" data-flavor-img="logo_bolisv2.png">
          Oreo
        </button>
      </div>
    </section>

    <!-- Sección Frappés -->
    <section id="seccion-frappes" class="menu-section space-y-4">
      <h2 class="heading-font text-xl font-bold">Frappés</h2>
      <div class="grid grid-cols-2 gap-4">
        <button class="frappe-flavor-btn p-4 bg-white rounded-2xl shadow-sm text-left font-bold" data-flavor-name="Frappé de Café" data-flavor-img="logo_bolisv2.png">
          Café
        </button>
        <button class="frappe-flavor-btn p-4 bg-white rounded-2xl shadow-sm text-left font-bold" data-flavor-name="Frappé Matcha" data-flavor-img="logo_bolisv2.png">
          Matcha
        </button>
      </div>
    </section>

    <!-- Sección Congelados -->
    <section id="seccion-congelados" class="menu-section space-y-4">
      <h2 class="heading-font text-xl font-bold">Congelados</h2>
      <div class="grid grid-cols-2 gap-4">
        <button class="congelados-flavor-btn p-4 bg-white rounded-2xl shadow-sm text-left font-bold" data-flavor-name="Helado Fresa" data-flavor-img="logo_bolisv2.png">
          Fresa
        </button>
      </div>
    </section>
  </main>

  <!-- Modal / Dialog de Promociones -->
  <dialog id="modalPromociones" class="p-6 rounded-3xl bg-white max-w-sm w-11/12 shadow-2xl border-0">
    <div class="text-center space-y-4">
      <h3 class="heading-font text-2xl font-bold text-[#f477b1]">¡Promoción del Día!</h3>
      <p class="text-slate-600">En la compra de 3 Bolis Gourmet, ¡llévate el cuarto a mitad de precio!</p>
      <button id="btnCerrarPromo" class="px-6 py-2 bg-[#f477b1] text-white font-bold rounded-full w-full">
        ¡Entendido!
      </button>
    </div>
  </dialog>

  <!-- Modal / Dialog para Carrusel Swiper -->
  <dialog id="modalCarrusel" class="p-0 bg-transparent border-0 overflow-visible">
    <div class="relative">
      <button id="btnCerrarCarrusel" class="absolute -top-10 right-0 text-white font-bold text-xl z-50">✕</button>
      <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="swiperWrapper">
          <!-- Slides dinámicos creados por JS -->
        </div>
      </div>
    </div>
  </dialog>

  <!-- Custom Script -->
  <script src="script.js"></script>
</body>
</html>
